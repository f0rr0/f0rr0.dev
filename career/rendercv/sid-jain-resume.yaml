          - "**Airbus Tripset:** solo technical partner to Milkinside for Airbus's public iOS/Android COVID travel companion; built the React Native app and backend aggregation layer over Airbus/Amadeus APIs, CMS-driven travel guidance, and itinerary notifications."
          - "**Mitsubishi Motors Puerto Rico / MMSC:** tech lead for MiAR virtual dealership and Outlander AR campaign; led native iOS/iPadOS and WebAR delivery with optimized 3D vehicles, low-end Android/browser support, bilingual content, and contest/admin workflows."
          - "**ZebPay:** technical lead for a 10-person embedded team modernizing iOS/Android apps and release infrastructure for one of India's largest crypto exchanges; shipped exchange, payments, wallet SDK, international KYC, and OTC workflows."
          - "**Texts.com:** built the production Facebook Messenger channel over undocumented/private messaging infrastructure, implementing protocol-compatible MQTT/Facebook Thrift handling, encrypted payload support, and feature-parity messaging."
          - "**Veera Browser:** led Android Chromium browser delivery from zero to Play Store, owning Chromium/Brave patch management, build/release tooling, rewards/feed/onboarding/search/tabs, privacy/security updates, and later iOS platform setup."
          - "**Memorang:** Head of CMS for an AI education platform; led schema-first AI CMS work for Cambridge/TOEFL content, dynamic question/component types, schema versioning, AI-generated questions/media, adaptive practice, and scoring workflows."
