design:
  theme: ink
  page:
    size: us-letter
    top_margin: 0.55in
    bottom_margin: 0.55in
    left_margin: 0.60in
    right_margin: 0.60in
    show_footer: true
    show_top_note: false
  colors:
    body: rgb(18, 22, 28)
    name: rgb(0, 86, 80)
    headline: rgb(0, 86, 80)
    connections: rgb(48, 59, 70)
    section_titles: rgb(0, 86, 80)
    links: rgb(0, 86, 80)
    footer: rgb(110, 118, 128)
    top_note: rgb(110, 118, 128)
  typography:
    line_spacing: 0.56em
    alignment: left
    date_and_location_column_alignment: right
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10.10pt
      name: 30pt
      headline: 10pt
      connections: 9.2pt
      section_titles: 1.25em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: left
    photo_width: 3.5cm
    photo_position: left
    photo_space_left: 0.4cm
    photo_space_right: 0.4cm
    space_below_name: 0.28cm
    space_below_headline: 0.30cm
    space_below_connections: 0.34cm
