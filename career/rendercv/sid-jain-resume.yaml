    line_thickness: 0.6pt
    space_above: 0.44cm
    space_below: 0.20cm
  sections:
    allow_page_break: false
    space_between_regular_entries: 1.15em
    space_between_text_based_entries: 0.28em
    show_time_spans_in: []
  entries:
    date_and_location_width: 3.65cm
    side_space: 0cm
    space_between_columns: 0.18cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
