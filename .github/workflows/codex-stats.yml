name: Codex stats

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-stats
  cancel-in-progress: false

jobs:
  sync:
    name: Sync public snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Codex
        run: npm install --global @openai/codex@0.152.1

      - name: Sync stats
        env:
          DATABASE_URL: ${{ secrets.ACTIVITY_DATABASE_URL }}
        run: bun run codex:sync
