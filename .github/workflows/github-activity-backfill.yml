name: Backfill GitHub activity

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start UTC day; max 31 days, broad runs within 62 days (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: End date — latest UTC day included, not in future (YYYY-MM-DD)
        required: true
        type: string
      account:
        description: Account whose token and accessible repositories are scanned
        required: true
        default: f0rr0
        type: choice
        options:
          - f0rr0
          - yuppiestechdev
          - all
      repository_id:
        description: Numeric repository ID; blank scans repositories active in the window
        required: false
        type: string
      maximum_minutes:
        description: Hard discovery/processing budget; incomplete work fails visibly (1-330 min)
        required: true
        default: 60
        type: number

concurrency:
  group: github-activity-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: Discover and process backfill
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Discover history and process work
        env:
          ACCOUNT: ${{ inputs.account }}
          DATABASE_URL: ${{ secrets.ACTIVITY_DATABASE_URL }}
          END_DATE: ${{ inputs.end_date }}
          GITHUB_F0RR0_TOKEN: ${{ secrets.ACTIVITY_F0RR0_TOKEN }}
          GITHUB_YUPPIESTECHDEV_TOKEN: ${{ secrets.ACTIVITY_YUPPIESTECHDEV_TOKEN }}
          MAXIMUM_MINUTES: ${{ inputs.maximum_minutes }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          START_DATE: ${{ inputs.start_date }}
        run: >-
          bun scripts/backfill-github-activity.ts
          --account "$ACCOUNT"
          --start-date "$START_DATE"
          --end-date "$END_DATE"
          --repository-id "$REPOSITORY_ID"
          --maximum-minutes "$MAXIMUM_MINUTES"
