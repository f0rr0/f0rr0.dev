name: Backfill GitHub activity

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Oldest commit date to include (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: Newest commit date to include (YYYY-MM-DD)
        required: true
        type: string
      account:
        description: Credential used to discover accessible repositories
        required: true
        default: f0rr0
        type: choice
        options:
          - f0rr0
          - yuppiestechdev
          - all
      repository_id:
        description: Optional numeric repository ID; blank scans all accessible repositories
        required: false
        type: string
      maximum_minutes:
        description: Maximum run time, including queueing and processing (1-330 minutes)
        required: true
        default: 300
        type: number

concurrency:
  group: github-activity-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: Queue and process backfill
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Queue and process GitHub history
        env:
          ACCOUNT: ${{ inputs.account }}
          DATABASE_URL: ${{ secrets.ACTIVITY_DATABASE_URL }}
          END_DATE: ${{ inputs.end_date }}
          GITHUB_F0RR0_TOKEN: ${{ secrets.ACTIVITY_F0RR0_TOKEN }}
          GITHUB_YUPPIESTECHDEV_TOKEN: ${{ secrets.ACTIVITY_YUPPIESTECHDEV_TOKEN }}
          MAXIMUM_MINUTES: ${{ inputs.maximum_minutes }}
          OPENAI_API_KEY: ${{ secrets.ACTIVITY_OPENAI_API_KEY }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          START_DATE: ${{ inputs.start_date }}
        run: >-
          bun scripts/backfill-github-activity.ts
          --account "$ACCOUNT"
          --start-date "$START_DATE"
          --end-date "$END_DATE"
          --repository-id "$REPOSITORY_ID"
          --maximum-minutes "$MAXIMUM_MINUTES"
