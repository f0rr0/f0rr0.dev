name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint (Oxlint, better-tailwindcss, shadcn)
        run: bun run lint:ox

      - name: Unused code and dependencies (Knip)
        run: bun run lint:unused

      - name: Typst format check
        run: bun run format:typ:check

      - name: Type check
        run: bun run typecheck

      - name: Type check deployment source
        run: |
          deployment_dir=$(mktemp -d)
          rsync -a --exclude-from=.vercelignore --exclude=.git --exclude=.next --exclude=node_modules --exclude='*.tsbuildinfo' ./ "$deployment_dir/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$deployment_dir/node_modules"
          bunx tsgo --noEmit --incremental false --project "$deployment_dir/tsconfig.json"
